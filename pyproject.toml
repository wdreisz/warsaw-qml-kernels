[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkbench"
version = "0.1.0"
description = "Quantum-kernel SVM vs classical models on real data with fold-safe nested CV (local simulation)"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = ["qiskit==2.6.0", "qiskit-aer==0.17.2", "qiskit-ibm-runtime==0.50.0", "numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]
